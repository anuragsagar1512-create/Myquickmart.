<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>My Quick Mart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="top">
  <div>
    <h1>🛒 My Quick Mart</h1>
    <p>Delhi | 📍 Location required</p>
  </div>
  <nav>
    <a href="#">Home</a>
    <a href="#">My Account</a>
    <a href="#">My Orders</a>
    <a href="#">Contact</a>
  </nav>
</header>

<section id="products" class="grid"></section>

<section class="checkout">
<h3>Checkout (COD)</h3>
<input id="name" placeholder="नाम">
<input id="phone" placeholder="मोबाइल">
<textarea id="address" placeholder="पूरा पता"></textarea>
<button onclick="placeOrder()">Order on WhatsApp</button>
</section>

<script src="supabase.js"></script>
<script src="script.js"></script>
</body>
</html>
